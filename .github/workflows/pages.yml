name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; skip runs queued between the run in-progress
# and latest queued run, but do NOT cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # action 一律取 node24 运行时的大版本：Node 20 运行时已被 GitHub 弃用，
      # checkout@v4 / setup-node@v4 / configure-pages@v5 / upload-pages-artifact@v3
      # 会在每次运行产生 "Node.js 20 is deprecated" 告警。升级时按住这一条选版本。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build for GitHub Pages
        # 自定义域名 docs.poxiaoshi.cn 把站点发布在域名根路径，所以 base 必须是 "/"。
        # vite.config.ts 的默认值 "/docs" 是给容器部署用的
        # （Dockerfile 的 DOCS_BASE_URL + nginx.conf.template 的 location ${DOCS_BASE_URL}/），
        # 不要改那个默认值，只在这里覆盖。
        env:
          VITE_BASE_URL: "/"
        run: |
          npx tsc --noEmit
          npx vite build --mode production
          # 守卫：base 写错时 CI 绿、部署绿、HTTP 也返回 200，只有浏览器白屏，
          # 所以必须在这里拦下来。dist/index.html 里不允许出现 /docs 前缀。
          if grep -qE '(src|href)="/docs/' dist/index.html; then
            echo "::error::dist/index.html 仍引用 /docs/ 前缀 —— VITE_BASE_URL 配置有误"
            grep -oE '(src|href)="/docs/[^"]*"' dist/index.html
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
