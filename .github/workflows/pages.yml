name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; skip runs queued between the run in-progress
# and latest queued run, but do NOT cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # action 一律取 node24 运行时的大版本：Node 20 运行时已被 GitHub 弃用，
      # checkout@v4 / setup-node@v4 / configure-pages@v5 / upload-pages-artifact@v3
      # 会在每次运行产生 "Node.js 20 is deprecated" 告警。升级时按住这一条选版本。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build for GitHub Pages
        # 自定义域名 docs.poxiaoshi.cn 把站点发布在域名根路径，所以 base 必须是 "/"。
        # vite.config.ts 的默认值 "/docs" 是给容器部署用的
        # （Dockerfile 的 DOCS_BASE_URL + nginx.conf.template 的 location ${DOCS_BASE_URL}/），
        # 不要改那个默认值，只在这里覆盖。
        env:
          VITE_BASE_URL: "/"
          SSG_SITE_URL: "https://docs.poxiaoshi.cn"
        run: |
          npx tsc --noEmit
          npx vite build --mode production
          # 静态预渲染：把 177 个文档路由写成 dist/<route>/index.html。
          # 不做这一步的话，GitHub Pages 对任何深层路径都返回 404.html ——
          # 站点在搜索引擎眼里只剩首页一个 URL，其余全是 404 空壳。
          node scripts/ssg.mjs
          # 守卫：base 写错时 CI 绿、部署绿、HTTP 也返回 200，只有浏览器白屏，
          # 所以必须在这里拦下来。dist/index.html 里不允许出现 /docs 前缀。
          if grep -qE '(src|href)="/docs/' dist/index.html; then
            echo "::error::dist/index.html 仍引用 /docs/ 前缀 —— VITE_BASE_URL 配置有误"
            grep -oE '(src|href)="/docs/[^"]*"' dist/index.html
            exit 1
          fi
          # 守卫：SSG 必须真的产出页面与 sitemap，否则 SEO 会静默失效（部署照样绿）。
          pages=$(find dist -name index.html | wc -l | tr -d ' ')
          if [ "$pages" -lt 170 ]; then
            echo "::error::SSG 只产出 $pages 个 index.html，预期 178 个 —— 静态化没生效"
            exit 1
          fi
          if [ ! -f dist/sitemap.xml ]; then
            echo "::error::缺少 dist/sitemap.xml"
            exit 1
          fi
          # 守卫：图片索引入口同样不能静默失效。
          # 计数统一用 '<url><loc>'（精确到 url 条目）：虽然 '<image:loc>' 并不含子串 '<loc>'，
          # 不会污染计数，但写精确一点更不容易在以后改格式时踩空。
          urls=$(grep -c '<url><loc>' dist/sitemap.xml | tr -d ' ')
          imgs=$(grep -c '<image:loc>' dist/sitemap.xml | tr -d ' ')
          if [ "$imgs" -lt 100 ]; then
            echo "::error::sitemap 只声明了 $imgs 张图片，预期 142 张 —— 图片索引入口失效"
            exit 1
          fi
          echo "SSG 产出 $pages 个静态页面 + sitemap.xml（$urls 条 URL / $imgs 张图片）"

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
